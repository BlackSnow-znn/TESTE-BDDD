<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Chat Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           CSS - ESTILIZAÇÃO PREMIUM (GLASSMORPHISM & DARK MODE)
           ========================================================================== */
        
        :root {
            /* Cores Dark Mode (Padrão) */
            --bg-deep: #0f0f0f;
            --sidebar-bg: #171717;
            --header-bg: rgba(15, 15, 15, 0.8);
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --msg-user-bg: #2f2f2f;
            --msg-ai-bg: transparent;
            --input-bg: #212121;
            --danger: #ef4444;
            --success: #22c55e;
            
            /* Efeitos */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.4);
            --transition-fast: all 0.2s ease;
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Light Mode Overrides */
        body.light-mode {
            --bg-deep: #f9f9f9;
            --sidebar-bg: #ffffff;
            --header-bg: rgba(249, 249, 249, 0.8);
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: rgba(0, 0, 0, 0.1);
            --glass-bg: rgba(0, 0, 0, 0.05);
            --msg-user-bg: #e5e7eb;
            --input-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            display: flex;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform 0.3s ease, var(--transition-smooth);
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .brand-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, var(--accent-color), #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-new-chat {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition-fast);
            font-weight: 500;
        }

        .btn-new-chat:hover {
            background: var(--glass-bg);
            border-color: var(--text-secondary);
        }

        .history-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .history-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            padding: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .history-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            transition: var(--transition-fast);
        }

        .history-item:hover {
            background: var(--glass-bg);
            color: var(--text-primary);
        }

        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .footer-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition-fast);
        }

        .footer-btn:hover {
            background: var(--glass-bg);
        }

        /* --- ÁREA PRINCIPAL --- */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-deep);
        }

        .chat-header {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .chat-header h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        .messages-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            scroll-behavior: smooth;
        }

        /* Scrollbar Customizada */
        .messages-wrapper::-webkit-scrollbar {
            width: 6px;
        }
        .messages-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-wrapper::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        /* --- MENSAGENS --- */
        .msg-row {
            display: flex;
            width: 100%;
            animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user-row { justify-content: flex-end; }
        .msg-row.ai-row { justify-content: flex-start; }

        .bubble {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.6;
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        .user-row .bubble {
            background-color: var(--msg-user-bg);
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .ai-row .bubble {
            background-color: var(--msg-ai-bg);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .bubble img {
            max-width: 100%;
            border-radius: 12px;
            margin-bottom: 10px;
            display: block;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .timestamp {
            display: block;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 8px;
            opacity: 0.8;
        }

        /* --- INPUT COMPONENTE (BASEADO NO SOLICITADO) --- */
        .input-container-fixed {
            padding: 20px 0 40px 0;
            background: linear-gradient(transparent, var(--bg-deep) 30%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group {
            width: 90%;
            max-width: 800px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 12px 16px;
            position: relative;
            box-shadow: var(--shadow-md);
            transition: var(--transition-smooth);
        }

        .input-group:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .input-wrapper-inner {
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1rem;
            padding: 8px 0;
            min-height: 24px;
            max-height: 200px;
            resize: none;
            line-height: 1.5;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
        }

        .icon-btn:hover {
            background: var(--glass-bg);
            color: var(--text-primary);
        }

        .send-btn {
            background: var(--accent-color);
            color: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .send-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .send-btn:disabled {
            background: #444;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Counter e Preview */
        .char-counter {
            position: absolute;
            bottom: -22px;
            right: 15px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .image-preview-bar {
            width: 100%;
            display: none;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px;
            position: relative;
        }

        .preview-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--accent-color);
        }

        .close-preview {
            position: absolute;
            top: 5px;
            left: 50px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- CONTEXT MENU (BOTÃO DIREITO) --- */
        .context-menu {
            position: fixed;
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 5px;
            display: none;
            z-index: 1000;
            box-shadow: var(--shadow-md);
            min-width: 150px;
        }

        .context-menu-item {
            padding: 8px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition-fast);
        }

        .context-menu-item:hover {
            background: var(--danger);
            color: white;
        }

        /* --- BEM-VINDO / PLACEHOLDER --- */
        .welcome-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0.6;
        }

        .welcome-container h1 { font-size: 2rem; margin-bottom: 10px; }

        /* --- RESPONSIVIDADE --- */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: -280px;
                height: 100%;
            }
            .sidebar.open {
                transform: translateX(280px);
            }
            .mobile-toggle {
                display: block !important;
            }
        }

        .mobile-toggle {
            display: none;
            margin-right: 15px;
        }
    </style>
</head>
<body id="appBody">

    <div id="customContextMenu" class="context-menu">
        <div class="context-menu-item" onclick="deleteTargetMessage()">
            <span>🗑️</span> Apagar Mensagem
        </div>
    </div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-icon">M</div>
                <span>TESTE</span>
            </div>
            <button class="btn-new-chat" onclick="createNewChat()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Novo Chat
            </button>
        </div>

        <div class="history-container" id="historyList">
            <div class="history-label">Recentes</div>
            </div>

        <div class="sidebar-footer">
            <button class="footer-btn" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span> <span id="themeText">Modo Escuro</span>
            </button>
            <button class="footer-btn" onclick="clearAllMessages()">
                <span>🗑️</span> Limpar Conversa
            </button>
        </div>
    </aside>

    <main class="main-chat">
        <header class="chat-header">
            <button class="icon-btn mobile-toggle" onclick="toggleSidebar()">☰</button>
            <h2 id="currentChatTitle">Novo Chat</h2>
        </header>

        <section class="messages-wrapper" id="chatWindow">
            <div class="welcome-container" id="welcomeMsg">
                <h1>TESTE</h1>
                <p>O que podemos criar hoje? Envie uma mensagem ou imagem.</p>
            </div>
            </section>

        <footer class="input-container-fixed">
            <div class="input-group">
                <div class="image-preview-bar" id="previewBar">
                    <img src="" id="imgPreviewSrc" class="preview-thumb">
                    <button class="close-preview" onclick="clearImageSelection()">&times;</button>
                </div>

                <div class="input-wrapper-inner">
                    <label for="fileUpload" class="icon-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </label>
                    <input type="file" id="fileUpload" hidden accept="image/*">

                    <textarea id="messageInput" placeholder="Mensagem TESTE AI..." rows="1"></textarea>

                    <button class="icon-btn send-btn" id="sendBtn" onclick="handleSend()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
                <div class="char-counter"><span id="charCount">0</span>/2000</div>
            </div>
        </footer>
    </main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://osrhdtzdbvasbejtglrb.supabase.co";
const supabaseKey = "sb_publishable_iypphmUmhyWH9bSDf-swoA_a0wJ_JJO";
const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

/* SEU JS TODO AQUI */
</script>


    <script>


        /* ==========================================================================
           JAVASCRIPT - LÓGICA FUNCIONAL (MODERNA & ROBUSTA)
           ========================================================================== */

        const state = {
            messages: [],
            selectedImage: null,
            isDarkMode: true,
            currentDeleteId: null
        };

        // Seletores DOM
        const chatWindow = document.getElementById('chatWindow');
        const messageInput = document.getElementById('messageInput');
        const fileUpload = document.getElementById('fileUpload');
        const previewBar = document.getElementById('previewBar');
        const imgPreviewSrc = document.getElementById('imgPreviewSrc');
        const charCount = document.getElementById('charCount');
        const welcomeMsg = document.getElementById('welcomeMsg');
        const contextMenu = document.getElementById('customContextMenu');

        // --- INICIALIZAÇÃO ---
        window.onload = () => {
            loadMessagesFromDB();
            renderMessages();
            renderHistory();
            setupAutoResize();
        };

async function handleSend() {
    const text = messageInput.value.trim();
    if (!text && !state.selectedImage) return;

    const newMessage = {
        text: text,
        image: state.selectedImage,
        type: 'user',
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    };

    // SALVA NO SUPABASE
    const { error } = await supabaseClient
        .from('messages')
        .insert([newMessage]);

    if (error) {
        console.error("Erro ao salvar:", error);
        alert("Erro ao salvar mensagem.");
        return;
    }

    resetInput();
    loadMessagesFromDB();
}
async function loadMessagesFromDB() {
    const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .order('id', { ascending: true });

    if (error) {
        console.error("Erro ao buscar:", error);
        return;
    }

    state.messages = data;
    renderMessages();
    scrollToBottom();
}


        function resetInput() {
            messageInput.value = '';
            messageInput.style.height = 'auto';
            clearImageSelection();
            updateCharCounter();
        }

        // --- MANIPULAÇÃO DE IMAGENS ---
        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    alert("Imagem muito grande! Máximo 2MB.");
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    state.selectedImage = event.target.result;
                    imgPreviewSrc.src = state.selectedImage;
                    previewBar.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        function clearImageSelection() {
            state.selectedImage = null;
            previewBar.style.display = 'none';
            fileUpload.value = '';
        }

        // --- RENDERIZAÇÃO ---
        function renderMessages() {
            if (state.messages.length > 0) {
                welcomeMsg.style.display = 'none';
            } else {
                welcomeMsg.style.display = 'flex';
            }

            chatWindow.innerHTML = '';
            if (state.messages.length === 0) chatWindow.appendChild(welcomeMsg);

            state.messages.forEach(msg => {
                const row = document.createElement('div');
                row.className = `msg-row ${msg.type}-row`;
                row.dataset.id = msg.id;

                let contentHtml = '';
                if (msg.image) contentHtml += `<img src="${msg.image}" alt="Enviado">`;
                if (msg.text) contentHtml += `<p>${msg.text.replace(/\n/g, '<br>')}</p>`;

                row.innerHTML = `
                    <div class="bubble">
                        ${contentHtml}
                        <span class="timestamp">${msg.timestamp}</span>
                    </div>
                `;

                // Evento de Deletar (Botão Direito)
                row.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showContextMenu(e.pageX, e.pageY, msg.id);
                });

                chatWindow.appendChild(row);
            });
        }

        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // --- UX & INPUT ACTIONS ---
        function setupAutoResize() {
            messageInput.addEventListener('input', () => {
                messageInput.style.height = 'auto';
                messageInput.style.height = (messageInput.scrollHeight) + 'px';
                updateCharCounter();
            });

            // Enter Key Logic
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });
        }

        function updateCharCounter() {
            const count = messageInput.value.length;
            charCount.textContent = count;
            if (count > 1900) charCount.style.color = 'var(--danger)';
            else charCount.style.color = 'var(--text-secondary)';
        }

        // --- CONTEXT MENU ---
        function showContextMenu(x, y, id) {
            state.currentDeleteId = id;
            contextMenu.style.display = 'block';
            contextMenu.style.left = `${x}px`;
            contextMenu.style.top = `${y}px`;
        }

        window.onclick = () => contextMenu.style.display = 'none';

async function deleteTargetMessage() {
    await supabaseClient
        .from('messages')
        .delete()
        .eq('id', state.currentDeleteId);

    loadMessagesFromDB();
}



async function clearAllMessages() {
    if (confirm("Tem certeza que deseja apagar todo o chat?")) {
        await supabaseClient
            .from('messages')
            .delete()
            .neq('id', 0);

        loadMessagesFromDB();
    }
}


        // --- TEMA ---
        function toggleTheme() {
            state.isDarkMode = !state.isDarkMode;
            document.body.classList.toggle('light-mode');
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            
            if (state.isDarkMode) {
                icon.innerText = "🌙";
                text.innerText = "Modo Escuro";
            } else {
                icon.innerText = "☀️";
                text.innerText = "Modo Claro";
            }
        }

        // --- SIDEBAR MOBILE ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const items = ["Análise de código", "Ideias de Marketing", "Resumo de reunião", "Planejamento 2026"];
            
            items.forEach(txt => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<span>💬</span> ${txt}`;
                list.appendChild(div);
            });
        }

        function createNewChat() {
            if (state.messages.length > 0) {
                if (confirm("Iniciar nova conversa? O histórico atual será mantido no sistema.")) {
                    state.messages = [];
                    renderMessages();
                }
            }
        }
        
        // Simulação de digitação fake para dar vida à UI
        function simulateAIResponse() {
            // Apenas para efeito visual de que o front está processando
            console.log("Processando entrada...");
        }

    </script>
</body>
</html>
